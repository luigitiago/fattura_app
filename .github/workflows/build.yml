name: Build executables

# Build a standalone executable for Windows, Linux and macOS.
#
# - Push a tag like v1.0.0  -> a GitHub Release is created with the files attached.
# - Or run it manually from the "Actions" tab -> download the artefacts.

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            icon: assets/icon.ico
          - os: ubuntu-latest
            name: linux
            icon: assets/icon.png
          - os: macos-latest
            name: macos
            icon: assets/icon.ico

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name FakturaManager \
            --icon "${{ matrix.icon }}" \
            --collect-all customtkinter \
            --add-data "assets:assets" \
            main.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name FakturaManager `
            --icon "${{ matrix.icon }}" `
            --collect-all customtkinter `
            --add-data "assets;assets" `
            main.py

      - name: Rename artefact per platform
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/FakturaManager.exe "dist/FakturaManager-windows.exe"
          else
            cp dist/FakturaManager "dist/FakturaManager-${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FakturaManager-${{ matrix.name }}
          path: |
            dist/FakturaManager-*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FakturaManager-*
